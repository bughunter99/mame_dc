<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAME Web Platform MVP</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main>
    <h1>MAME Web Platform MVP</h1>
    <p>Django 백엔드 + 브라우저 WASM 프런트엔드 프로토타입</p>
    <section>
      <button id="load-games">게임 목록 불러오기</button>
      <button id="sync-local-roms">로컬 ROM 동기화</button>
      <ul id="games"></ul>
    </section>
    <section>
      <h2>에뮬레이터</h2>
      <p id="emulator-status">대기 중</p>
      <p id="error-summary" class="error-summary" hidden></p>
      <p id="rom-diagnosis-summary" class="rom-diagnosis-summary" hidden></p>
      <div class="emulator-toolbar">
        <button id="toggle-fullscreen">전체화면</button>
        <span class="mobile-hint">모바일: 가로 모드 권장</span>
      </div>
      <canvas id="canvas" width="960" height="720"></canvas>
      <div id="touch-controls" class="touch-controls" aria-label="모바일 컨트롤">
        <div class="dpad" role="group" aria-label="방향키">
          <button id="touch-up" class="touch-btn up" data-key="ArrowUp">▲</button>
          <button id="touch-left" class="touch-btn left" data-key="ArrowLeft">◀</button>
          <button id="touch-right" class="touch-btn right" data-key="ArrowRight">▶</button>
          <button id="touch-down" class="touch-btn down" data-key="ArrowDown">▼</button>
        </div>
        <div class="actions" role="group" aria-label="액션 버튼">
          <button id="touch-action-1" class="touch-btn action" data-key="ControlLeft">P1</button>
          <button id="touch-action-2" class="touch-btn action" data-key="AltLeft">P2</button>
          <button id="touch-action-3" class="touch-btn action" data-key="Space">P3</button>
          <button id="touch-action-4" class="touch-btn action" data-key="ShiftLeft">K1</button>
          <button id="touch-action-5" class="touch-btn action" data-key="KeyZ">K2</button>
          <button id="touch-action-6" class="touch-btn action" data-key="KeyX">K3</button>
          <button id="touch-coin" class="touch-btn system" data-key="Digit5">COIN</button>
          <button id="touch-start" class="touch-btn system" data-key="Digit1">START</button>
        </div>
      </div>
    </section>
    <section>
      <h2>플레이 데이터</h2>
      <p>현재 게임 ID: <span id="current-game-id">-</span></p>
      <p>현재 세션 ID: <span id="current-session-id">-</span></p>
      <div class="controls-row">
        <label for="score-input">점수</label>
        <input id="score-input" type="number" min="0" value="1000">
        <button id="submit-score">점수 저장</button>
      </div>
      <div class="controls-row">
        <label for="save-file-input">세이브 파일</label>
        <input id="save-file-input" type="file" accept=".state,.sav,.bin,.zip">
        <label for="save-slot-input">슬롯</label>
        <input id="save-slot-input" type="number" min="0" max="9" value="0">
        <button id="upload-save">세이브 업로드</button>
      </div>
    </section>
    <section>
      <h2>리더보드</h2>
      <div class="controls-row">
        <label for="leaderboard-game">게임</label>
        <select id="leaderboard-game"></select>
        <button id="refresh-leaderboard">새로고침</button>
      </div>
      <table id="leaderboard-table">
        <thead>
          <tr>
            <th>순위</th>
            <th>유저</th>
            <th>점수</th>
            <th>시간</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr>
            <td colspan="4">리더보드를 불러오세요.</td>
          </tr>
        </tbody>
      </table>
    </section>
    <section>
      <h2>로그</h2>
      <pre id="log"></pre>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
